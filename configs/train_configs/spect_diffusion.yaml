model:
  diffusion_config:
    beta_min: 0.05
    beta_max: 20
  net_config:
    dim: 128
    pe_scale: 1
  checkpoint: /depot/jgmakin/data/bilal/pretrained_models/hifi_spect_diff/checkpoint-steps-2000000.pth


data:
  name: ljspeech
  dataset_config:
    cache_dir: /scratch/gilbreth/ahmedb/cache/hf_cache/ljspeech
    data_tag: keithito/lj_speech
    val_metadata: configs/data/ljspeech/ljspeech_validation.txt
    max_duration: 3   # seconds
    sampling_rate: 22050
    processor_config:
      name: hifi
      params:
        sampling_rate: 22050
        hop_size: 256
        win_size: 1024
        num_mels: 80
        n_fft: 1024
        fmin: 0
        fmax: 8000
        use_pow_spec: True


trainer:
  trainer_config:
    output_dir: /scratch/gilbreth/ahmedb/trained_models/audio_diffusion
    exp_name: hifi_power_spec
    lr: 2.e-4
    lr_decay: 0.999
    warmup_factor: 0.6
    warmup_epochs: 100
    gradient_clip: 1.0
    distributed: True


  train_method:
    # num_epochs: 1             
    max_steps: 2000000          # max_steps takes precedence when both provided
    batch_size: 32               # Total batch size
    # batch_size_per_device: 8    # batch size per gpu
    resume_training: True
    # start_from_chkpt: None  
    chkpt_save_steps: 10000
    train_log_steps: 500
    eval_log_steps: 5000
    


